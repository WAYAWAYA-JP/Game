<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームお得情報キュレーション</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .platform-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: white;
            color: #667eea;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .deal-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .deal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .deal-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .platform-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .badge-steam { background: linear-gradient(135deg, #1b2838, #2a475e); }
        .badge-epic { background: linear-gradient(135deg, #0078F2, #00A8FF); }
        .badge-epic-games { background: linear-gradient(135deg, #0078F2, #00A8FF); }
        .badge-gog { background: linear-gradient(135deg, #86328a, #a347a7); }
        .badge-humble { background: linear-gradient(135deg, #cc0000, #ff4444); }
        .badge-humble-bundle { background: linear-gradient(135deg, #cc0000, #ff4444); }
        .badge-fanatical { background: linear-gradient(135deg, #ff6b00, #ff8c00); }
        .badge-prime-gaming { background: linear-gradient(135deg, #00A8E1, #0D7EBF); }
        .badge-ios { background: linear-gradient(135deg, #555555, #000000); }
        .badge-android { background: linear-gradient(135deg, #3DDC84, #07C160); }
        .badge-ios\/android { background: linear-gradient(135deg, #555555, #3DDC84); }

        .deal-type {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .type-free {
            background: #10b981;
            color: white;
        }

        .type-sale {
            background: #f59e0b;
            color: white;
        }

        .deal-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .deal-description {
            color: #6b7280;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .deal-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .deal-price {
            font-size: 1.5em;
            font-weight: bold;
            color: #10b981;
        }

        .deal-original-price {
            text-decoration: line-through;
            color: #9ca3af;
            font-size: 1em;
            margin-left: 10px;
        }

        .deal-discount {
            background: #ef4444;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .deal-deadline {
            color: #dc2626;
            font-size: 0.9em;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .deal-date {
            color: #9ca3af;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .deal-link {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .deal-link:hover {
            transform: scale(1.05);
        }

        .category-title {
            color: white;
            font-size: 1.8em;
            margin-bottom: 20px;
            margin-top: 30px;
            padding-bottom: 10px;
            border-bottom: 3px solid rgba(255,255,255,0.3);
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            padding: 20px;
            opacity: 0.8;
        }

        footer a {
            color: white;
            text-decoration: underline;
        }

        .update-time {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2em;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .pagination-button {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            min-width: 40px;
        }

        .pagination-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .pagination-button.active {
            background: white;
            color: #667eea;
        }

        .pagination-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: white;
            font-size: 14px;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .deals-grid {
                grid-template-columns: 1fr;
            }

            .platform-tabs {
                gap: 5px;
            }

            .tab-button {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 ゲームお得情報キュレーション</h1>
            <p class="subtitle">Steam・Epic Games・GOG・Humble Bundle・Fanaticalなどの無料配布・セール情報</p>
            <div class="update-time" id="update-time">最終更新: 読み込み中...</div>
        </header>

        <div class="platform-tabs">
            <button class="tab-button active" onclick="showTab('pc')">🖥️ PC</button>
            <button class="tab-button" onclick="showTab('mobile')">📱 スマホ</button>
        </div>

        <!-- PC版セクション -->
        <div id="pc-content" class="content-section active">
            <h2 class="category-title">🎁 無料配布中のゲーム</h2>
            <div class="deals-grid" id="pc-free-games">
                <div class="loading">読み込み中...</div>
            </div>
            <div class="pagination" id="pc-free-pagination"></div>

            <h2 class="category-title">🔥 注目のセール情報</h2>
            <div class="deals-grid" id="pc-sale-games">
                <div class="loading">読み込み中...</div>
            </div>
            <div class="pagination" id="pc-sale-pagination"></div>
        </div>

        <!-- スマホ版セクション -->
        <div id="mobile-content" class="content-section">
            <h2 class="category-title">🎁 無料ゲーム・期間限定イベント</h2>
            <div class="deals-grid" id="mobile-free-games">
                <div class="loading">読み込み中...</div>
            </div>
            <div class="pagination" id="mobile-free-pagination"></div>

            <h2 class="category-title">💰 セール・お得情報</h2>
            <div class="deals-grid" id="mobile-sale-games">
                <div class="loading">読み込み中...</div>
            </div>
            <div class="pagination" id="mobile-sale-pagination"></div>
        </div>

        <footer>
            <p>🎮 このサイトは各ゲームプラットフォームのお得情報をキュレーションしています</p>
            <p>参考: <a href="https://jj-labo.seesaa.net/" target="_blank">JJ PCゲームラボ</a> | <a href="https://automaton-media.com/" target="_blank">AUTOMATON</a></p>
            <p style="margin-top: 10px; font-size: 0.9em;">※ 各リンク先で最新の情報をご確認ください</p>
        </footer>
    </div>

    <script>
        const ITEMS_PER_PAGE = 6;
        let currentPages = {
            'pc-free': 1,
            'pc-sale': 1,
            'mobile-free': 1,
            'mobile-sale': 1
        };
        let allData = null;

        // タブ切り替え
        function showTab(platform) {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });

            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });

            document.getElementById(platform + '-content').classList.add('active');
            event.target.classList.add('active');
        }

        // プラットフォーム名を正規化
        function normalizePlatform(platform) {
            return platform.toLowerCase().replace(/\s+/g, '-').replace(/\//g, '\\/');
        }

        // ゲームカードを生成
        function createGameCard(game) {
            const platformClass = 'badge-' + normalizePlatform(game.platform);
            const typeClass = 'type-' + game.type;

            let priceHtml = '';
            if (game.price) {
                priceHtml = `<div class="deal-price">${game.price}</div>`;
                if (game.originalPrice) {
                    priceHtml += `<span class="deal-original-price">${game.originalPrice}</span>`;
                }
            }

            let discountHtml = '';
            if (game.discount) {
                discountHtml = `<span class="deal-discount">${game.discount}</span>`;
            }

            return `
                <div class="deal-card">
                    <div class="deal-header">
                        <span class="platform-badge ${platformClass}">${game.platform}</span>
                        <span class="deal-type ${typeClass}">${game.type === 'free' ? '無料' : 'セール'}</span>
                    </div>
                    ${game.date ? `<div class="deal-date">📅 ${game.date}</div>` : ''}
                    <div class="deal-title">${game.title}</div>
                    <div class="deal-description">${game.description}</div>
                    ${priceHtml || discountHtml ? `
                        <div class="deal-info">
                            <div>${priceHtml}</div>
                            <div>${discountHtml}</div>
                        </div>
                    ` : ''}
                    ${game.deadline ? `<div class="deal-deadline">⏰ ${game.deadline}</div>` : ''}
                    <a href="${game.url}" class="deal-link" target="_blank">詳細を見る →</a>
                </div>
            `;
        }

        // ページネーションボタンを生成
        function createPagination(category, totalItems) {
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            if (totalPages <= 1) return '';

            const currentPage = currentPages[category];
            let html = '';

            // 前へボタン
            html += `<button class="pagination-button" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage('${category}', ${currentPage - 1})">« 前へ</button>`;

            // ページ番号
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="pagination-button ${i === currentPage ? 'active' : ''}" onclick="changePage('${category}', ${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span class="pagination-info">...</span>`;
                }
            }

            // 次へボタン
            html += `<button class="pagination-button" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage('${category}', ${currentPage + 1})">次へ »</button>`;

            return html;
        }

        // ページ切り替え
        function changePage(category, page) {
            currentPages[category] = page;
            displayGames();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ゲームを表示
        function displayGames() {
            if (!allData) return;

            const categories = [
                { key: 'pc-free', data: allData.pc.free, container: 'pc-free-games', pagination: 'pc-free-pagination' },
                { key: 'pc-sale', data: allData.pc.sale, container: 'pc-sale-games', pagination: 'pc-sale-pagination' },
                { key: 'mobile-free', data: allData.mobile.free, container: 'mobile-free-games', pagination: 'mobile-free-pagination' },
                { key: 'mobile-sale', data: allData.mobile.sale, container: 'mobile-sale-games', pagination: 'mobile-sale-pagination' }
            ];

            categories.forEach(cat => {
                const page = currentPages[cat.key];
                const start = (page - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const pageData = cat.data.slice(start, end);

                const container = document.getElementById(cat.container);
                container.innerHTML = pageData.map(game => createGameCard(game)).join('');

                const paginationContainer = document.getElementById(cat.pagination);
                paginationContainer.innerHTML = createPagination(cat.key, cat.data.length);
            });
        }

        // データを読み込んで表示
        async function loadGamesData() {
            try {
                const response = await fetch('games-data.json');
                allData = await response.json();

                displayGames();

                // 最終更新日時を更新
                const now = new Date();
                const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
                document.getElementById('update-time').textContent = `最終更新: ${dateStr}`;

            } catch (error) {
                console.error('データの読み込みに失敗しました:', error);
                document.querySelectorAll('.loading').forEach(el => {
                    el.textContent = 'データの読み込みに失敗しました';
                });
            }
        }

        // ページロード時にデータを読み込み
        document.addEventListener('DOMContentLoaded', function() {
            loadGamesData();
        });
    </script>
</body>
</html>
